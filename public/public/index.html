<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryVideo — Idea to Video</title>
<style>
  :root{
    --navy:#1b2036; --cream:#f6f2ea; --cream-2:#efe9dd;
    --ink:#20223a; --orange:#e8944a; --orange-deep:#c9762f; --line:#ddd4c2;
    --serif: "Iowan Old Style","Palatino Linotype",Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--serif);}
  .app{max-width:720px;margin:0 auto;padding-bottom:60px;}
  header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:16px 20px;}
  header .mark{width:34px;height:34px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:18px;}
  header .name{font-size:17px;font-weight:600;}
  header .sub{font-size:10px;letter-spacing:.12em;color:#9aa2c4;text-transform:uppercase;}
  .hero{padding:30px 24px 8px;}
  h1{font-size:34px;margin:0 0 10px;font-weight:500;}
  h1 em{color:var(--orange-deep);font-style:italic;}
  .hero p{color:#5a5f7a;font-size:15px;max-width:50ch;}
  .panel{margin:20px 20px 0;background:var(--cream-2);border:1px solid var(--line);border-top:2px solid var(--orange);padding:20px;}
  textarea{width:100%;min-height:120px;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:var(--serif);font-size:15px;}
  .row{display:flex;justify-content:flex-end;margin-top:12px;}
  button.primary{background:var(--orange);color:#3a2205;border:none;padding:11px 22px;border-radius:8px;font-family:var(--serif);font-weight:600;font-size:14.5px;cursor:pointer;}
  button.primary:disabled{opacity:.5;}
  .progress-wrap{margin:20px 20px 0;}
  .bar-track{background:var(--cream-2);border:1px solid var(--line);border-radius:20px;height:10px;overflow:hidden;}
  .bar-fill{background:var(--orange);height:100%;width:0%;transition:width .4s ease;}
  .status-text{font-size:13px;color:#6b6754;margin-top:8px;}
  .log{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px;color:#68624a;max-height:160px;overflow-y:auto;font-family:monospace;}
  .video-wrap{margin:20px 20px 0;}
  video{width:100%;border-radius:8px;border:1px solid var(--line);}
  .download{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px;}
  .error-box{margin:14px 20px 0;background:#fbe9e4;border:1px solid #e3a08e;color:#8a3a20;font-size:13.5px;padding:12px 14px;border-radius:6px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">🎬</div>
    <div>
      <div class="name">StoryVideo</div>
      <div class="sub">Idea → Video</div>
    </div>
  </header>

  <div class="hero">
    <h1>Paste an idea.<br>Get a <em>finished video</em>.</h1>
    <p>Scenes, images, narration, and camera movement — generated and stitched together automatically.</p>
  </div>

  <div class="panel">
    <textarea id="story" placeholder="Paste your story or idea..."></textarea>
    <div class="row">
      <button class="primary" id="genBtn">✨ Generate video</button>
    </div>
  </div>

  <div id="progressSection" class="progress-wrap" style="display:none;">
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="status-text" id="statusText">Starting...</div>
    <div class="log" id="logBox"></div>
  </div>

  <div id="videoSection" class="video-wrap" style="display:none;">
    <video id="videoPlayer" controls></video><br>
    <a class="download" id="downloadLink" download>⬇ Download video</a>
  </div>

  <div id="errorBox" class="error-box" style="display:none;"></div>
</div>

<script>
const genBtn = document.getElementById('genBtn');
const storyInput = document.getElementById('story');
const progressSection = document.getElementById('progressSection');
const barFill = document.getElementById('barFill');
const statusText = document.getElementById('statusText');
const logBox = document.getElementById('logBox');
const videoSection = document.getElementById('videoSection');
const videoPlayer = document.getElementById('videoPlayer');
const downloadLink = document.getElementById('downloadLink');
const errorBox = document.getElementById('errorBox');

let pollTimer = null;

genBtn.addEventListener('click', async () => {
  const story = storyInput.value.trim();
  if (!story) { alert('Please paste a story or idea first.'); return; }

  errorBox.style.display = 'none';
  videoSection.style.display = 'none';
  progressSection.style.display = 'block';
  barFill.style.width = '0%';
  logBox.innerHTML = '';
  genBtn.disabled = true;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ story })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to start job.');
    pollStatus(data.jobId);
  } catch (err) {
    showError(err.message);
    genBtn.disabled = false;
  }
});

function pollStatus(jobId){
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/status/${jobId}`);
      const job = await res.json();
      if (!res.ok) throw new Error(job.error || 'Job not found.');

      barFill.style.width = job.progress + '%';
      statusText.textContent = describeStatus(job.status) + ` (${job.progress}%)`;
      logBox.innerHTML = job.log.map(l => `<div>${escapeHtml(l)}</div>`).join('');
      logBox.scrollTop = logBox.scrollHeight;

      if (job.status === 'done'){
        clearInterval(pollTimer);
        genBtn.disabled = false;
        videoSection.style.display = 'block';
        videoPlayer.src = job.videoUrl;
        downloadLink.href = job.videoUrl;
      } else if (job.status === 'error'){
        clearInterval(pollTimer);
        genBtn.disabled = false;
        showError(job.error);
      }
    } catch (err) {
      clearInterval(pollTimer);
      genBtn.disabled = false;
      showError(err.message);
    }
  }, 2000);
}

function describeStatus(status){
  switch(status){
    case 'queued': return 'Queued';
    case 'breaking_down': return 'Breaking story into scenes';
    case 'generating_images': return 'Generating images';
    case 'generating_audio': return 'Generating narration';
    case 'assembling': return 'Assembling video';
    case 'done': return 'Done';
    case 'error': return 'Error';
    default: return status;
  }
}

function showError(msg){
  errorBox.style.display = 'block';
  errorBox.textContent = 'Error: ' + msg;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}
</script>
</body>
</html>
